[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-toolkit"
version = "0.1.0"
description = "Plug-and-play utilities for building MCP clients and servers with any LLM provider"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Himanshu Sahni" }]
keywords = ["mcp", "model-context-protocol", "ai", "agents", "tools", "openai", "gemini", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp[cli]>=1.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openai = ["openai>=2.14.0"]
gemini = ["google-genai>=1.0.0"]
langchain = [
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
]
anthropic = ["anthropic>=0.40.0"]
all = ["mcp-toolkit[openai,gemini,langchain,anthropic]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/himanshusahni/Model-Context-Protocol-MCP-"
Repository = "https://github.com/himanshusahni/Model-Context-Protocol-MCP-"
Issues = "https://github.com/himanshusahni/Model-Context-Protocol-MCP-/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_toolkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
