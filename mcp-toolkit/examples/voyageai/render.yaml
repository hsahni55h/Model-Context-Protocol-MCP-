services:
  - type: web
    name: voyageai
    runtime: python
    buildCommand: pip install ./mcp-toolkit && pip install ./mcp-toolkit/examples/voyageai
    startCommand: cd mcp-toolkit/examples/voyageai && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: EXCHANGE_RATE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: voyageai-data
      mountPath: /app/mcp-toolkit/examples/voyageai/data
      sizeGB: 1
